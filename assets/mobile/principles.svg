<g transform="translate(30 36) scale(1.1)" ><path d="M24 4 L45 15 L24 26 L3 15 Z M3 24 L24 35 L45 24 M3 33 L24 44 L45 33" fill="none" stroke="#66E3F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="113" y="48" fill="#66E3F1" font-family="Courier New, monospace" font-size="18" font-weight="600" text-anchor="start">CLARITY FIRST</text><text x="113" y="86" fill="#EDF5FF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Clean architecture.</text><text x="113" y="122" fill="#93A8C1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Readable, maintainable code.</text><line x1="28" y1="172" x2="612" y2="172" stroke="#22344A" stroke-width="1" /><g transform="translate(30 208) scale(1.1)" ><path d="M24 12 L24 24 M8 34 L8 24 L40 24 L40 34" fill="none" stroke="#AA9AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="17" y="1" width="14" height="11" rx="2" fill="none" stroke="#AA9AFF" /><rect x="1" y="34" width="14" height="11" rx="2" fill="none" stroke="#AA9AFF" /><rect x="17" y="34" width="14" height="11" rx="2" fill="none" stroke="#AA9AFF" /><rect x="33" y="34" width="14" height="11" rx="2" fill="none" stroke="#AA9AFF" /><line x1="24" y1="24" x2="24" y2="34" stroke="#AA9AFF" stroke-width="2" /></g><text x="113" y="220" fill="#AA9AFF" font-family="Courier New, monospace" font-size="18" font-weight="600" text-anchor="start">SYSTEMS THAT CONNECT</text><text x="113" y="258" fill="#EDF5FF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Thoughtful APIs.</text><text x="113" y="294" fill="#93A8C1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Reliable data interactions.</text><line x1="28" y1="344" x2="612" y2="344" stroke="#22344A" stroke-width="1" /><g transform="translate(30 380) scale(1.1)" ><path d="M8 14 Q3 14 3 22 L3 30 Q3 36 9 3