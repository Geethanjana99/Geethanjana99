name: Refresh public profile stats

# Manual-only by default: no scheduled automation is enabled on upload.
# To opt in to a daily refresh, uncomment the schedule below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository_owner == 'Geethanjana99'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate a local card from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Geethanjana99
        run: python3 scripts/refresh_stats.py
      - name: Commit the refreshed card
        run: |
          if [ -z "$(git status --porcelain -- assets/github-activity.svg)" ]; then
            echo "No card changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git commit -m "Update public profile statistics [skip ci]"
          git push
